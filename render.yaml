services:
  - type: web
    name: balaji-dashboard
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn balaji_os.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: balaji_os
